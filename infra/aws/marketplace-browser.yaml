AWSTemplateFormatVersion: '2010-09-09'
Description: Free browser scanner Marketplace lifecycle delivery; no additional compute capacity.
Parameters:
  WebTaskRoleName:
    Type: String
  ProductCode:
    Type: String
    Default: 1rlcf9he502qz0ix13gqfiaoc
  ProductId:
    Type: String
    Default: prod-35ca6yuplccjo
  AlertEmail:
    Type: String
    Default: ''
    Description: Owner-approved alert address; confirm the SNS subscription email after deployment.
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
Resources:
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: certscore-marketplace-browser-alerts
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertsTopic
  AlertsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertsTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:certscore-marketplace-browser-*
  DeliveryDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: certscore-marketplace-browser-delivery-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  DeliveryDeadLetterPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DeliveryDeadLetters]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt DeliveryDeadLetters.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/certscore-marketplace-browser-licenses
  EventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: certscore-marketplace-browser-events
      SignatureVersion: '2'
  EventsDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: certscore-marketplace-browser-events-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  DeadLetterPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventsDeadLetters]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt EventsDeadLetters.Arn
            Condition:
              ArnEquals: {aws:SourceArn: !Ref EventsTopic}
  LifecycleRule:
    Type: AWS::Events::Rule
    DependsOn: DeliveryDeadLetterPolicy
    Properties:
      Name: certscore-marketplace-browser-licenses
      EventPattern:
        source: [aws.agreement-marketplace]
        account: [!Ref AWS::AccountId]
        detail-type: [License Updated - Manufacturer, License Deprovisioned - Manufacturer]
        detail:
          product:
            code: [!Ref ProductCode]
            id: [!Ref ProductId]
      Targets:
        - Id: marketplace-browser-sns
          Arn: !Ref EventsTopic
          RoleArn: !GetAtt EventDeliveryRole.Arn
          DeadLetterConfig:
            Arn: !GetAtt DeliveryDeadLetters.Arn
  EventDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/certscore-marketplace-browser-licenses
      Policies:
        - PolicyName: publish-marketplace-browser
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref EventsTopic
  WebSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: [DeadLetterPolicy, WebMarketplaceAccess]
    Properties:
      Protocol: https
      Endpoint: https://certscore.ai/api/marketplace/browser/events
      TopicArn: !Ref EventsTopic
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDeadLetters.Arn
  WebMarketplaceAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: certscore-marketplace-browser
      Roles: [!Ref WebTaskRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [aws-marketplace:ResolveCustomer, aws-marketplace:DescribeAgreement]
            Resource: '*'
          - Effect: Allow
            Action: sns:ConfirmSubscription
            Resource: !Ref EventsTopic
  DeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: certscore-marketplace-browser-delivery-failed
      AlarmDescription: Marketplace event delivery exhausted retries. Inspect the EventBridge delivery DLQ and target permissions.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions: [{Name: RuleName, Value: !Ref LifecycleRule}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  NotificationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: certscore-marketplace-browser-notification-failed
      AlarmDescription: Marketplace HTTPS notification delivery failed. Inspect web endpoint health and the SNS redrive queue.
      Namespace: AWS/SNS
      MetricName: NumberOfNotificationsFailed
      Dimensions: [{Name: TopicName, Value: !GetAtt EventsTopic.TopicName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  DeliveryBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: certscore-marketplace-browser-delivery-backlog
      AlarmDescription: Undelivered EventBridge events retained for 14 days. Investigate and replay through the events SNS topic after fixing delivery.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt DeliveryDeadLetters.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  NotificationBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: certscore-marketplace-browser-notification-backlog
      AlarmDescription: Undelivered SNS notifications retained for 14 days. Investigate and replay original lifecycle events after fixing HTTPS delivery.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt EventsDeadLetters.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
Outputs:
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  DeliveryDeadLetterQueueUrl:
    Value: !Ref DeliveryDeadLetters
  TopicArn:
    Value: !Ref EventsTopic
  DeadLetterQueueUrl:
    Value: !Ref EventsDeadLetters
